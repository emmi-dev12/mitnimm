services:
  - type: web
    name: mitnimm
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx tsx worker/src/node.ts
    healthCheckPath: /api/spots
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
